name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - id: prepare
        run: node scripts/prepare-release.js
      - if: steps.prepare.outputs.publish == 'true'
        run: npm publish --access public
      - if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          NOTES_FILE: ${{ steps.prepare.outputs.notes-file }}
          TARGET_SHA: ${{ github.sha }}
        run: gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
