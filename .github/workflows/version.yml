name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Pull request de versão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: npm run changeset:version
          commit-message: "Chore :see_no_evil: Atualiza versão e CHANGELOG"
          pr-title: "Chore :see_no_evil: Atualiza versão e CHANGELOG"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          GITHUB_OUTPUT="$RUNNER_TEMP/outputs.txt" node scripts/prepare-version-pr-body.js "$RUNNER_TEMP/body.md"
          changed=$(sed -n 's/^changed=//p' "$RUNNER_TEMP/outputs.txt")
          if [ "$changed" = "true" ]; then
            gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
          fi
