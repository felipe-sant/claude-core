name: Issue Size Set

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "28 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-agent
  cancel-in-progress: false

jobs:
  select:
    name: Seleção
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      classify: ${{ steps.select.outputs.classify }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: select
        run: node .github/issue-agent/select-issues.js size-set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  classify:
    name: Classificação
    needs: select
    if: needs.select.outputs.classify != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    env:
      CLASSIFY: ${{ needs.select.outputs.classify }}
      CLASSIFICATION_MARK: Tamanho definido pelo agente de issues
      PULL_REQUEST_LINE: Aberto pelo agente de issues.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Foto de antes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_DIR: ${{ runner.temp }}/issue-check
        run: |
          mkdir -p "$CHECK_DIR"
          git ls-remote origin refs/heads/main | cut -f1 > "$CHECK_DIR/main"
          git ls-remote --heads origin | sort > "$CHECK_DIR/branches"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq "[.[] | select(.user.login == \"claude[bot]\" or ((.body // \"\") | contains(\"$PULL_REQUEST_LINE\")))] | length" | awk '{total += $1} END {print total + 0}' > "$CHECK_DIR/pulls"
          read -r -a numbers <<< "${CLASSIFY//,/ }"
          for number in "${numbers[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name | select(startswith("Size:") | not)] | sort | join(",")' > "$CHECK_DIR/labels-$number"
          done
      - name: Contexto filtrado das issues
        run: |
          read -r -a numbers <<< "${CLASSIFY//,/ }"
          node .github/issue-agent/issue-context.js "$CONTEXT_DIR" "${numbers[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT_DIR: ${{ runner.temp }}/issue-agent
      - id: prompt
        name: Montagem das instruções
        env:
          CONTEXT_DIR: ${{ runner.temp }}/issue-agent
        run: |
          {
            echo "text<<PROMPT_END"
            cat .github/issue-agent/size-set-prompt.md
            printf '\n## Valores desta execução\n\n- classify: %s\n- Pasta do contexto filtrado: %s\n- Link da execução: %s\n' "$CLASSIFY" "$CONTEXT_DIR" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "PROMPT_END"
          } >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          display_report: true
          claude_args: |
            --max-turns 60
            --add-dir ${{ runner.temp }}/issue-agent
            --allowedTools "Read,Glob,Grep,Bash(gh issue comment:*),Bash(gh issue edit * --add-label *)"
            --disallowedTools 'Bash(*$*),Bash(*`*),Bash(*environ*),Bash(*/proc/*),Bash(*--body-file*),Bash(*--file*),Bash(*--template*),Bash(* -F*),Bash(* -T *),Bash(env:*),Bash(printenv:*),Bash(export:*),Bash(set:*),Bash(declare:*),Bash(cat *environ*),Bash(head *environ*),Bash(tail *environ*),Bash(echo *TOKEN*),Bash(printf *TOKEN*),Read(//proc/**),Bash(gh issue edit *--title*),Bash(gh issue edit *--body*),Bash(gh issue edit *--add-assignee*),Bash(gh issue edit *--remove-assignee*),Bash(gh issue edit *--add-project*),Bash(gh issue edit *--remove-project*),Bash(gh issue edit *--milestone*),Bash(gh pr merge:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*)'
            --permission-mode dontAsk
      - name: Conferência final
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_DIR: ${{ runner.temp }}/issue-check
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          failures=0
          fail() { echo "::error::$1"; failures=$((failures + 1)); }
          main_after=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$main_after" = "$(cat "$CHECK_DIR/main")" ] || fail "A branch principal mudou durante a execução."
          git ls-remote --heads origin | sort | cmp -s - "$CHECK_DIR/branches" || fail "A lista de branches mudou durante a execução."
          open_agent_pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq "[.[] | select(.user.login == \"claude[bot]\" or ((.body // \"\") | contains(\"$PULL_REQUEST_LINE\")))] | length" | awk '{total += $1} END {print total + 0}')
          echo "Pull requests do agente abertos: $open_agent_pulls"
          [ "$open_agent_pulls" -le "$(cat "$CHECK_DIR/pulls")" ] || fail "A classificação abriu pull request."
          read -r -a numbers <<< "${CLASSIFY//,/ }"
          for number in "${numbers[@]}"; do
            sizes=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name | select(startswith("Size:"))] | length')
            others=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name | select(startswith("Size:") | not)] | sort | join(",")')
            marks=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.body | contains(\"$CLASSIFICATION_MARK\"))] | length" | awk '{total += $1} END {print total + 0}')
            echo "Issue $number: etiquetas de tamanho=$sizes, comentários de classificação=$marks"
            [ "$marks" -le 1 ] || fail "A issue $number tem mais de um comentário de classificação."
            [ "$sizes" -le 1 ] || fail "A issue $number tem mais de uma etiqueta de tamanho."
            [ "$others" = "$(cat "$CHECK_DIR/labels-$number")" ] || fail "As etiquetas da issue $number que não são de tamanho mudaram."
            if [ "$CLAUDE_OUTCOME" = "success" ]; then
              [ "$sizes" -eq 1 ] || fail "A issue $number deveria ter exatamente uma etiqueta de tamanho."
              [ "$marks" -eq 1 ] || fail "A issue $number ficou sem comentário de classificação."
            fi
          done
          [ "$failures" -eq 0 ]

  chain:
    name: Encadeamento
    needs: [select, classify]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.classify.result == 'success' || needs.classify.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: agent
        run: node .github/issue-agent/select-issues.js agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.agent.outputs.pr_issue != ''
        run: gh workflow run issue-claude-agent.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
